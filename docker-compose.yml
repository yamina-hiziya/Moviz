services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8086:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-moviz}
      DB_USER: ${MYSQL_USER:-moviz}
      DB_PASSWORD: ${MYSQL_PASSWORD:-moviz_dev}
      # Connexion à MongoDB (base NoSQL des statistiques de vues)
      MONGO_URI: mongodb://${MONGO_USER:-mooviz}:${MONGO_PASSWORD:-mooviz_dev}@mongo:27017
      MONGO_DB: ${MONGO_DATABASE:-mooviz}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started

  db:
    image: mysql:8.0
    ports:
      - "3311:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moviz}
      MYSQL_USER: ${MYSQL_USER:-moviz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moviz_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-moviz_root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      # Script SQL importé automatiquement au premier démarrage (base vide)
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  # Base NoSQL : statistiques de consultation des films
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mooviz}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mooviz_dev}
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: